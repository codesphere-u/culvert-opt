[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "culvert-opt"
version = "0.1.0"
description = "Zero-dependency rural feeder-road drainage & culvert hydraulics kit: Kirpich time of concentration, Rational Method peak runoff (Q=CiA), Manning circular/box culvert sizing, scour-velocity riprap apron guard, and re-gravelling budget."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "civil-engineering",
    "culvert",
    "hydrology",
    "rural-roads",
    "drainage",
    "manning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
culvert-opt = "culvert_opt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/culvert_opt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
